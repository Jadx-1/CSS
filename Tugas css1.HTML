    2.a Uber <br>

    <style>
      .btn-request {

        cursor: pointer;
      }

    <button class="btn-request">Request now</button>

    <br><br>
    2.b Amazon

    <style>
      .btn-panjang {
        background-color: rgb(255, 216, 20);
        color: #000;
        width: 150px;
        height: 35px;
        border: 2px solid rgb(255, 216, 20);
        border-radius: 50px;
        cursor: pointer;
      }
    </style>

    <br>
    <a href="https://www.amazon.com/gp/cart/view.html?ref_=nav_cart" target="_blank">
      <button class="btn-panjang">Add to Cart</button>

    <br><br>
    2.c Github
    <br>

    <style>
      .btn-github {
        background-color: rgb(46, 164, 79);
        color: #fff;
        width: 90px;
        height: 50px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>

    <a href="https://github.com" target="_blank">
      <button class="btn-github">Sign up</button>
    </a>

    <br><br>
    2.d Bootstrap
    <br>

    <style>
      .btn-bootstrap {
        background-color: rgb(121, 82, 179);
        color: #fff;
        width: 120px;
        height: 50px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }

      .btn-download {
        background-color: #fff;
        color: #000;
        width: 90px;
        height: 50px;
        border: 1px solid rgb(108, 117, 125);
        border-radius: 5px;
        cursor: pointer;
      }
    </style>

    <a href="https://getbootstrap.com/docs/5.3/getting-started/download/" target="_blank">
      <button class="btn-bootstrap">Get started</button>
    </a>
    <button class="btn-download">Download</button>

    <br><br>
    2.e LinkedIn
    <br>

    <style>
      .btn-linkedin {
        background-color: rgb(10, 102, 194);
        color: white;
        width: 200px;
        height: 45px;
        border-radius: 50px;
        cursor: pointer;
      }

      .btn-save {
        background-color: white;
        color: rgb(10, 102, 194);
        width: 90px;
        height: 45px;
        border: 1px solid rgb(10, 102, 194);
        border-radius: 50px;
        cursor: pointer;
      }
    </style>

    <a href="https://www.linkedin.com/jobs/view/" target="_blank">
      <button class="btn-linkedin">Apply on company website</button>
    </a>
    <button class="btn-save">Save</button>
